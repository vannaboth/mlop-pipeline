services:
  # Flask Web & Chatbot Frontend Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-web
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OLLAMA_BASE_URL=http://ollama:11434
      - SLM_MODEL=qwen2.5:0.5b
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - chatbot-net

  # Small Language Model (SLM) Container
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-slm
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - chatbot-net

  # Auto-pull lightweight SLM model into Ollama on startup
  model-puller:
    image: curlimages/curl:latest
    container_name: chatbot-model-puller
    depends_on:
      - ollama
    restart: "no"
    networks:
      - chatbot-net
    command: >
      sh -c "
        echo 'Waiting for Ollama service...';
        until curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 2;
        done;
        echo 'Pulling SLM model qwen2.5:0.5b...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:0.5b\"}';
        echo 'SLM model ready!';
      "

volumes:
  ollama-models:

networks:
  chatbot-net:
    driver: bridge
